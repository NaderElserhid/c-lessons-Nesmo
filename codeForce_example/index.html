<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شرح المصفوفة التراكمية ثنائية الأبعاد</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }
        .grid-wrapper {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        table {
            border-collapse: collapse;
            margin: 0 auto;
        }
        td {
            width: 40px;
            height: 40px;
            border: 2px solid #ccc;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
        /* الألوان التوضيحية */
        .val { background-color: #ffd700; } /* أصفر للخلية الحالية */
        .top { background-color: #87ceeb; } /* أزرق للمربع العلوي */
        .left { background-color: #98fb98; } /* أخضر للمربع الأيسر */
        .overlap { background-color: #ff9999; } /* أحمر لمنطقة التقاطع */
        .math-sign {
            font-size: 30px;
            font-weight: bold;
            margin: 0 10px;
        }
        h2 { color: #2c3e50; }
        .legend {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .legend div {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .box { width: 20px; height: 20px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h2>الشرح البصري لمعادلة Prefix Sum</h2>
    <p dir="ltr"><code>pref[i][j] = val + pref[i-1][j] + pref[i][j-1] - pref[i-1][j-1]</code></p>

    <div class="container">
        <div class="grid-wrapper">
            <h3>val</h3>
            <table>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td class="val">V</td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
            </table>
        </div>

        <div class="math-sign">+</div>

        <div class="grid-wrapper">
            <h3>pref[i-1][j]</h3>
            <table>
                <tr><td class="top"></td><td class="top"></td><td class="top"></td><td></td></tr>
                <tr><td class="top"></td><td class="top"></td><td class="top"></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
            </table>
        </div>

        <div class="math-sign">+</div>

        <div class="grid-wrapper">
            <h3>pref[i][j-1]</h3>
            <table>
                <tr><td class="left"></td><td class="left"></td><td></td><td></td></tr>
                <tr><td class="left"></td><td class="left"></td><td></td><td></td></tr>
                <tr><td class="left"></td><td class="left"></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
            </table>
        </div>

        <div class="math-sign">-</div>

        <div class="grid-wrapper">
            <h3>pref[i-1][j-1]</h3>
            <table>
                <tr><td class="overlap"></td><td class="overlap"></td><td></td><td></td></tr>
                <tr><td class="overlap"></td><td class="overlap"></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
                <tr><td></td><td></td><td></td><td></td></tr>
            </table>
        </div>
    </div>

    <div class="legend">
        <div><div class="box val"></div> الخلية الحالية الجديدة</div>
        <div><div class="box top"></div> المستطيل العلوي</div>
        <div><div class="box left"></div> المستطيل الأيسر</div>
        <div><div class="box overlap"></div> منطقة التقاطع (تُطرح لأنها جُمعت مرتين)</div>
    </div>

</body>
</html>
