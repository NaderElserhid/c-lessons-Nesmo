<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DOM Practice</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-color: #f2ecec;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;

            background-color: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        h2 {
            color: #444;
            margin-top: 30px;
        }

        .section {
            margin-top: 25px;
        }

        .input-container {
            display: flex;
            gap: 10px;
        }

        input,
        select {
            flex: 1;

            min-width: 0;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        button {
            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            background-color: #333;

            color: white;

            cursor: pointer;

            font-size: 16px;
        }

        button:hover {
            background-color: #555;
        }

        #shoppingList {
            padding: 0;

            margin: 15px 0 0;

            list-style: none;
        }

        #shoppingList li {
            background-color: #f2ecec;

            padding: 12px;

            margin-bottom: 10px;

            border-radius: 8px;

            font-size: 16px;
        }

        .language-container {
            display: flex;
            gap: 10px;
        }

        #languageResult {
            margin-top: 15px;

            font-size: 18px;

            font-weight: bold;

            color: #333;
        }


        /* Responsive */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            .input-container,
            .language-container {
                flex-direction: column;
            }

            input,
            select,
            button {
                width: 100%;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>DOM Practice</h1>


        <!-- Shopping List -->

        <div class="section">

            <h2>Shopping List</h2>

            <div class="input-container">

                <input
                    id="itemInput"
                    type="text"
                    placeholder="Enter an item..."
                >

                <button id="addButton">
                    Add Item
                </button>

            </div>

            <ul id="shoppingList"></ul>

        </div>


        <!-- Language Selection -->

        <div class="section">

            <h2>Choose a Language</h2>

            <div class="language-container">

                <select id="languageSelect">

                    <option value="">
                        Select a language
                    </option>

                    <option value="English">
                        English
                    </option>

                    <option value="French">
                        French
                    </option>

                    <option value="Spanish">
                        Spanish
                    </option>

                    <option value="German">
                        German
                    </option>

                    <option value="Arabic">
                        Arabic
                    </option>

                    <option value="Turkish">
                        Turkish
                    </option>

                </select>

                <button id="selectButton">
                    Select
                </button>

            </div>

            <p id="languageResult"></p>

        </div>

    </div>


    <script>

        // =====================================
        // SHOPPING LIST
        // =====================================


        // Get HTML elements

        const itemInput =
            document.getElementById("itemInput");

        const addButton =
            document.getElementById("addButton");

        const shoppingList =
            document.getElementById("shoppingList");


        // Add item when button is clicked

        addButton.addEventListener("click", function () {

            // Get input value

            const item = itemInput.value;


            // Check if input is empty

            if (item === "") {
                return;
            }


            // Create a new list item

            const listItem =
                document.createElement("li");


            // Add text to the list item

            listItem.textContent = item;


            // Add list item to the list

            shoppingList.appendChild(listItem);


            // Clear input

            itemInput.value = "";

        });



        // =====================================
        // LANGUAGE SELECT
        // =====================================


        // Get language elements

        const languageSelect =
            document.getElementById("languageSelect");

        const selectButton =
            document.getElementById("selectButton");

        const languageResult =
            document.getElementById("languageResult");


        // When Select button is clicked

        selectButton.addEventListener("click", function () {

            // Get selected language

            const language = languageSelect.value;


            // Check if nothing was selected

            if (language === "") {

                languageResult.textContent =
                    "Please choose a language.";

                return;
            }


            // Display selected language

            languageResult.textContent =
                "You selected: " + language;

        });

    </script>

</body>

</html>
