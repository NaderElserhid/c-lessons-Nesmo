
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stopwatch App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .stopwatch {
            width: 380px;
            padding: 30px;
            background: #ffffff;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 25px;
            color: #222;
        }

        .display {
            font-size: 55px;
            font-weight: bold;
            color: #222;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .start {
            background: #2ecc71;
        }

        .pause {
            background: #f39c12;
        }

        .reset {
            background: #e74c3c;
        }

        .lap {
            background: #3498db;
        }

        .laps {
            margin-top: 25px;
            max-height: 180px;
            overflow-y: auto;
            text-align: left;
        }

        .lap-item {
            padding: 10px;
            margin-bottom: 7px;
            background: #f1f1f1;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 450px) {
            .stopwatch {
                width: 90%;
                padding: 20px;
            }

            .display {
                font-size: 42px;
            }

            button {
                padding: 11px 16px;
            }
        }
    </style>
</head>

<body>

    <div class="stopwatch">

        <h1>⏱ Stopwatch</h1>

        <div class="display" id="display">
            00:00:00.00
        </div>

        <div class="buttons">

            <button class="start" onclick="startStopwatch()">
                Start
            </button>

            <button class="pause" onclick="pauseStopwatch()">
                Pause
            </button>

            <button class="reset" onclick="resetStopwatch()">
                Reset
            </button>

            <button class="lap" onclick="addLap()">
                Lap
            </button>

        </div>

        <div class="laps" id="laps"></div>

    </div>


    <script>

        let startTime = 0;
        let elapsedTime = 0;
        let timer = null;

        const display = document.getElementById("display");
        const laps = document.getElementById("laps");


        function startStopwatch() {

            if (timer !== null) {
                return;
            }

            startTime = Date.now() - elapsedTime;

            timer = setInterval(updateDisplay, 10);
        }


        function pauseStopwatch() {

            if (timer === null) {
                return;
            }

            clearInterval(timer);

            timer = null;

            elapsedTime = Date.now() - startTime;
        }


        function resetStopwatch() {

            clearInterval(timer);

            timer = null;

            startTime = 0;
            elapsedTime = 0;

            display.innerText = "00:00:00.00";

            laps.innerHTML = "";
        }


        function updateDisplay() {

            elapsedTime = Date.now() - startTime;

            let milliseconds = Math.floor(
                (elapsedTime % 1000) / 10
            );

            let seconds = Math.floor(
                (elapsedTime / 1000) % 60
            );

            let minutes = Math.floor(
                (elapsedTime / (1000 * 60)) % 60
            );

            let hours = Math.floor(
                elapsedTime / (1000 * 60 * 60)
            );


            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");
            seconds = String(seconds).padStart(2, "0");
            milliseconds = String(milliseconds).padStart(2, "0");


            display.innerText =
                `${hours}:${minutes}:${seconds}.${milliseconds}`;
        }


        function addLap() {

            if (timer === null) {
                return;
            }

            const lap = document.createElement("div");

            lap.className = "lap-item";

            lap.innerHTML = `
                <span>Lap ${laps.children.length + 1}</span>
                <strong>${display.innerText}</strong>
            `;

            laps.prepend(lap);
        }

    </script>

</body>
</html>
