<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار البرمجة | Programming Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --text: #e2e8f0;
    --muted: #64748b;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 20%, rgba(0,212,255,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 10% 80%, rgba(124,58,237,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 50px;
    animation: fadeDown 0.8s ease both;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.25);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 100px;
    margin-bottom: 20px;
  }

  .badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }

  h1 {
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 900;
    line-height: 1.2;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .subtitle { color: var(--muted); font-size: 15px; font-weight: 400; }

  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 16px;
    animation: fadeUp 0.6s ease both 0.2s;
  }

  .progress-bar-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    width: 0%;
    transition: width 0.5s ease;
  }

  .progress-text {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 28px 24px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s ease both;
    transition: border-color 0.3s;
  }

  .question-card:hover { border-color: rgba(0,212,255,0.2); }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 3px;
    height: 100%;
    background: linear-gradient(to bottom, var(--accent), var(--accent2));
    border-radius: 0 16px 16px 0;
  }

  .question-card.answered::before {
    background: linear-gradient(to bottom, #22c55e, #16a34a);
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 18px;
  }

  .q-number {
    min-width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    color: #fff;
    flex-shrink: 0;
  }

  .q-level {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 100px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .level-easy { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.2); }
  .level-medium { background: rgba(234,179,8,0.15); color: #facc15; border: 1px solid rgba(234,179,8,0.2); }
  .level-hard { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.2); }

  .q-text { font-size: 15px; line-height: 1.75; font-weight: 600; color: var(--text); flex: 1; }
  .q-text-en { font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 5px; }

  .code-block {
    background: #0d1117;
    border: 1px solid rgba(0,212,255,0.12);
    border-radius: 8px;
    padding: 14px 18px;
    margin: 14px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #a5f3fc;
    overflow-x: auto;
    direction: ltr;
    text-align: left;
    white-space: pre;
    line-height: 1.75;
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  @media (max-width: 540px) {
    .options-grid { grid-template-columns: 1fr; }
    .q-header { flex-wrap: wrap; }
    .container { padding: 24px 14px 60px; }
  }

  .option-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: right;
    transition: all 0.2s ease;
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    font-size: 14px;
    font-weight: 600;
    width: 100%;
  }

  .option-btn:hover {
    background: rgba(0,212,255,0.07);
    border-color: rgba(0,212,255,0.35);
    transform: translateY(-1px);
  }

  .option-btn.selected {
    background: rgba(124,58,237,0.15);
    border-color: var(--accent2);
    color: #c4b5fd;
  }

  .option-btn.selected .opt-letter {
    background: var(--accent2);
    color: #fff;
  }

  .opt-letter {
    min-width: 30px; height: 30px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .opt-text { flex: 1; }

  .opt-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #a5f3fc;
    background: rgba(0,0,0,0.35);
    padding: 3px 10px;
    border-radius: 5px;
    direction: ltr;
    text-align: left;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 44px 0 22px;
    animation: fadeUp 0.5s ease both;
  }

  .section-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to left, transparent, var(--border));
  }

  .section-title {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .submit-wrap {
    text-align: center;
    margin-top: 44px;
    animation: fadeUp 0.5s ease both;
  }

  .submit-btn {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none;
    border-radius: 12px;
    padding: 17px 60px;
    font-family: 'Cairo', sans-serif;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 1px;
    box-shadow: 0 0 30px rgba(0,212,255,0.2);
    position: relative;
    overflow: hidden;
  }

  .submit-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.4s;
  }

  .submit-btn:hover::before { left: 100%; }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 40px rgba(0,212,255,0.35); }
  .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  .result-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 44px 36px;
    margin-top: 32px;
    text-align: center;
    animation: scaleIn 0.5s ease both;
  }

  .result-panel.show { display: block; }

  .result-score {
    font-size: 80px;
    font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }

  .result-total { color: var(--muted); font-size: 18px; margin: 8px 0 22px; }
  .result-message { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .result-sub { color: var(--muted); font-size: 14px; }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 24px 0;
    flex-wrap: wrap;
  }

  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 24px;
    text-align: center;
  }

  .stat-val {
    font-size: 26px;
    font-weight: 900;
    font-family: 'JetBrains Mono', monospace;
  }

  .stat-lbl { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 2px; }

  .retry-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.25);
    color: var(--accent);
    padding: 12px 32px;
    border-radius: 10px;
    font-family: 'Cairo', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .retry-btn:hover { background: rgba(0,212,255,0.2); transform: translateY(-1px); }

  .warning {
    background: rgba(234,179,8,0.1);
    border: 1px solid rgba(234,179,8,0.25);
    color: #facc15;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 16px;
    display: none;
    text-align: center;
  }

  .warning.show { display: block; }

  @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
  @keyframes scaleIn  { from { opacity:0; transform:scale(0.95); }       to { opacity:1; transform:scale(1);    } }
  @keyframes pulse    { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">Quiz · 40 سؤال</div>
    <h1>اختبار البرمجة التنافسية</h1>
    <p class="subtitle">اختر الإجابة الصحيحة لكل سؤال · Choose the correct answer for each question</p>
  </header>

  <div class="progress-wrap">
    <span style="color:var(--muted);font-size:13px;font-weight:600;">التقدم</span>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
    <span class="progress-text" id="progressText">0 / 40</span>
  </div>

  <div id="questionsContainer"></div>

  <div class="submit-wrap">
    <button class="submit-btn" id="submitBtn" onclick="submitQuiz()">تسليم الاختبار ✓</button>
    <div class="warning" id="warning">⚠️ يرجى الإجابة على جميع الأسئلة قبل التسليم</div>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="result-score" id="scoreNum">0</div>
    <div class="result-total">/ 40 سؤال</div>
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-val" id="statEasy" style="color:#4ade80">-</div>
        <div class="stat-lbl">سهل / 15</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statMed" style="color:#facc15">-</div>
        <div class="stat-lbl">متوسط / 15</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="statHard" style="color:#f87171">-</div>
        <div class="stat-lbl">صعب / 10</div>
      </div>
    </div>
    <div class="result-message" id="resultMsg"></div>
    <div class="result-sub" id="resultSub"></div>
    <button class="retry-btn" onclick="retryQuiz()">↺ إعادة المحاولة</button>
  </div>
</div>

<script>
const QUESTIONS = [
  // ===== EASY (1-15) =====
  {
    num:1, level:'easy',
    text:'أي من العوامل التالية يمثل بوابة XOR على مستوى البت في لغة C++؟',
    textEn:'Which of the following operators represents the bitwise XOR gate in C++?',
    code:null,
    options:['&','|','^','~'],
    answer:2
  },
  {
    num:2, level:'easy',
    text:'ما هي الكلمة المفتاحية المستخدمة لتعريف نوع بيانات مخصص في C++؟',
    textEn:'What keyword is used to define a custom data type in C++?',
    code:null,
    options:['class','typedef','struct','def'],
    answer:2
  },
  {
    num:3, level:'easy',
    text:'كم عدد المجموعات الجزئية الممكنة لمصفوفة تحتوي على N من العناصر؟',
    textEn:'How many possible subsets are there for an array containing N elements?',
    code:null,
    options:['N²','2ᴺ','N!','2N'],
    answer:1
  },
  {
    num:4, level:'easy',
    text:'في خوارزمية التراجع (Backtracking)، ماذا نفعل عندما نصل إلى طريق مسدود؟',
    textEn:'In the Backtracking algorithm, what do we do when we reach a dead end?',
    code:null,
    options:[
      'نوقف البرنامج (Stop the program)',
      'نتراجع ونجرب مساراً آخر (Undo and try another path)',
      'نزيد حجم المصفوفة (Increase the array size)',
      'نعيد تشغيل الدالة من البداية (Restart the function)'
    ],
    answer:1
  },
  {
    num:5, level:'easy',
    text:'ماذا يعني حرف S في إطار SRTBOT للبرمجة الديناميكية؟',
    textEn:"What does the letter 'S' stand for in the SRTBOT framework for DP?",
    code:null,
    options:['Space (المساحة)','String (نص)','State (الحالة)','Sum (المجموع)'],
    answer:2
  },
  {
    num:6, level:'easy',
    text:'في هندسة المستطيلات، كيف نحسب طول مجال أحادي البعد يبدأ من L وينتهي عند R؟',
    textEn:'In rectangle geometry, how do we calculate the length of a 1D interval starting at L and ending at R?',
    code:null,
    options:['R + L','R × L','R - L','L - R'],
    answer:2
  },
  {
    num:7, level:'easy',
    text:'ما هو الغرض الرئيسي من عملية التذكار (Memoization) في البرمجة الديناميكية؟',
    textEn:'What is the main purpose of Memoization in Dynamic Programming?',
    code:null,
    options:[
      'تقليل استهلاك الذاكرة',
      'تجنب إعادة حساب المسائل الفرعية المتكررة',
      'ترتيب المصفوفة',
      'تحويل الكود إلى كود تكراري'
    ],
    answer:1
  },
  {
    num:8, level:'easy',
    text:'أي قناع ثنائي (Bitmask) يمثل المجموعة الجزئية الفارغة؟',
    textEn:'Which bitmask represents the empty subset?',
    code:null,
    options:['1','~0','0','-1'],
    answer:2
  },
  {
    num:9, level:'easy',
    text:'كيف نصل إلى المتغير age داخل كائن يسمى hero من نوع Struct؟',
    textEn:'How do we access the variable age inside an object named hero of a Struct type?',
    code:null,
    options:['hero->age','hero[age]','hero.age','hero::age'],
    answer:2
  },
  {
    num:10, level:'easy',
    text:'ماذا يمثل الحرف B في إطار SRTBOT؟',
    textEn:"What does the letter 'B' represent in the SRTBOT framework?",
    code:null,
    options:[
      'Binary Search (بحث ثنائي)',
      'Base Cases (الحالات الأساسية)',
      'Backtracking (تراجع)',
      'Bottom-Up (من أسفل لأعلى)'
    ],
    answer:1
  },
  {
    num:11, level:'easy',
    text:'ما هو الرمز البرمجي الذي يمثل عملية الإزاحة لليسار؟',
    textEn:'Which operator represents the Left Shift bitwise operation?',
    code:null,
    options:['>>','<<','^','||'],
    answer:1
  },
  {
    num:12, level:'easy',
    text:'في البرمجة الديناميكية، أي أسلوب يعتمد على ملء جدول باستخدام الحلقات (Loops)؟',
    textEn:'In DP, which approach relies on filling a table using loops?',
    code:null,
    options:['Top-Down','Recursion','Bottom-Up','Backtracking'],
    answer:2
  },
  {
    num:13, level:'easy',
    text:'لمعرفة تقاطع مستطيلين، يجب أن يتداخلا في:',
    textEn:'For two rectangles to intersect, they must overlap in:',
    code:null,
    options:[
      'محور X فقط (X-axis only)',
      'محور Y فقط (Y-axis only)',
      'كلا المحورين X و Y (Both X and Y axes)',
      'المساحة الكلية فقط (Total area only)'
    ],
    answer:2
  },
  {
    num:14, level:'easy',
    text:'ما هي بنية البيانات الشجرية المستخدمة ذهنياً لتخيل خوارزمية التراجع؟',
    textEn:'What is the tree data structure mentally used to visualize Backtracking?',
    code:null,
    options:[
      'Binary Search Tree (شجرة البحث الثنائي)',
      'State-Space Tree (شجرة فضاء الحالات)',
      'Segment Tree (شجرة القطع)',
      'Fenwick Tree'
    ],
    answer:1
  },
  {
    num:15, level:'easy',
    text:'اقرأ الكود التالي، ما هو المخرجات؟',
    textEn:'Read the following code, what is the output?',
    code:`int x = 5;\ncout << (x ^ x);`,
    options:['5','10','0','1'],
    answer:2
  },

  // ===== MEDIUM (16-30) =====
  {
    num:16, level:'medium',
    text:'ما هي العملية الصحيحة لضبط (جعل قيمته 1) البت رقم k في المتغير x؟',
    textEn:'What is the correct operation to set (make it 1) the k-th bit in variable x?',
    code:null,
    options:['x &= (1 << k);','x |= (1 << k);','x ^= (1 << k);','x += (1 << k);'],
    answer:1, codeOpts:true
  },
  {
    num:17, level:'medium',
    text:'اقرأ الكود التالي، ما هو المخرجات؟',
    textEn:'Read the following code, what is the output?',
    code:`int n = 3;\ncout << (1 << n);`,
    options:['6','3','9','8'],
    answer:3
  },
  {
    num:18, level:'medium',
    text:'اقرأ الكود التالي، ما هو المخرجات؟',
    textEn:'Read the following code, what is the output?',
    code:`struct Point { int x, y; };\nPoint p = {10, 20};\ncout << p.x + p.y;`,
    options:['10','20','30','Compilation Error'],
    answer:2
  },
  {
    num:19, level:'medium',
    text:'لدينا المصفوفة {10, 20, 30}. ما هي المجموعة الجزئية التي يمثلها القناع الثنائي 5 (بالثنائي 101)؟',
    textEn:'Given array {10, 20, 30}. What subset does the bitmask 5 (binary 101) represent?',
    code:null,
    options:['{10, 20}','{20, 30}','{10, 30}','{30}'],
    answer:2
  },
  {
    num:20, level:'medium',
    text:'في خوارزمية التراجع (Backtracking)، ماذا نعني بمصطلح "التقليم" (Pruning)؟',
    textEn:'In Backtracking, what does the term "Pruning" mean?',
    code:null,
    options:[
      'إزالة البتات الصفرية (Removing zero bits)',

const TOTAL = 40;
const letters = ['A','B','C','D'];
const selections = {};

function getLevelInfo(level) {
  if (level === 'easy')   return ['سهل',   'level-easy'];
  if (level === 'medium') return ['متوسط', 'level-medium'];
  return                         ['صعب',   'level-hard'];
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildSectionHeader(title, color) {
  const div = document.createElement('div');
  div.className = 'section-header';
  div.innerHTML = `
    <div class="section-line"></div>
    <span class="section-title" style="color:${color}">${title}</span>
    <div class="section-line" style="background:linear-gradient(to right,transparent,var(--border))"></div>`;
  return div;
}

function buildQuestions() {
  const container = document.getElementById('questionsContainer');

  QUESTIONS.forEach((q, idx) => {
    // Section headers
    if (q.num === 1)  container.appendChild(buildSectionHeader('🟢 المستوى السهل · Easy Level', '#4ade80'));
    if (q.num === 16) container.appendChild(buildSectionHeader('🟡 المستوى المتوسط · Medium Level', '#facc15'));
    if (q.num === 31) container.appendChild(buildSectionHeader('🔴 المستوى الصعب · Hard Level', '#f87171'));

    const [lvlText, lvlClass] = getLevelInfo(q.level);

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `card-${idx}`;

    const codeHtml = q.code ? `<div class="code-block">${esc(q.code)}</div>` : '';

    const optHtml = q.options.map((opt, oi) => {
      const inner = q.codeOpts
        ? `<span class="opt-code">${esc(opt)}</span>`
        : `<span class="opt-text">${esc(opt)}</span>`;
      return `<button class="option-btn" id="opt-${idx}-${oi}" onclick="selectOption(${idx},${oi})">
        <span class="opt-letter">${letters[oi]}</span>${inner}
      </button>`;
    }).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-number">${q.num < 10 ? '0'+q.num : q.num}</div>
        <div style="flex:1">
          <div class="q-text">${esc(q.text)}</div>
          <div class="q-text-en">${esc(q.textEn)}</div>
        </div>
        <span class="q-level ${lvlClass}">${lvlText}</span>
      </div>
      ${codeHtml}
      <div class="options-grid">${optHtml}</div>`;

    container.appendChild(card);
  });
}

function selectOption(qIdx, optIdx) {
  const prev = selections[qIdx];
  if (prev !== undefined)
    document.getElementById(`opt-${qIdx}-${prev}`).classList.remove('selected');

  selections[qIdx] = optIdx;
  document.getElementById(`opt-${qIdx}-${optIdx}`).classList.add('selected');
  document.getElementById(`card-${qIdx}`).classList.add('answered');
  updateProgress();
}

function updateProgress() {
  const done = Object.keys(selections).length;
  document.getElementById('progressFill').style.width = (done / TOTAL * 100) + '%';
  document.getElementById('progressText').textContent = done + ' / ' + TOTAL;
}

function submitQuiz() {
  if (Object.keys(selections).length < TOTAL) {
    const w = document.getElementById('warning');
    w.classList.add('show');
    setTimeout(() => w.classList.remove('show'), 4000);
    return;
  }

  let score = 0, easy = 0, med = 0, hard = 0;
  QUESTIONS.forEach((q, idx) => {
    const correct = selections[idx] === q.answer;
    if (correct) {
      score++;
      if (q.level === 'easy')   easy++;
      if (q.level === 'medium') med++;
      if (q.level === 'hard')   hard++;
    }
  });

  document.getElementById('scoreNum').textContent = score;
  document.getElementById('statEasy').textContent = easy;
  document.getElementById('statMed').textContent  = med;
  document.getElementById('statHard').textContent = hard;

  const pct = Math.round(score / TOTAL * 100);
  let msg = '', sub = '';
  if (pct === 100) { msg = '🏆 مثالي! أداء استثنائي';           sub = 'Perfect score — extraordinary performance!'; }
  else if (pct >= 85) { msg = '🎉 ممتاز جداً!';                 sub = 'Excellent work! You\'re crushing it.'; }
  else if (pct >= 70) { msg = '✅ جيد جداً — استمر في التعلم'; sub = 'Great job! Keep refining your skills.'; }
  else if (pct >= 50) { msg = '📚 جيد — راجع بعض المفاهيم';   sub = 'Good effort! Review the tricky parts.'; }
  else if (pct >= 30) { msg = '💡 تحتاج مزيداً من المراجعة';   sub = 'Keep studying — you\'ll get there!'; }
  else                { msg = '📖 راجع المواد وحاول مجدداً';   sub = 'Review the material thoroughly and retry.'; }

  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultSub').textContent = sub;

  const panel = document.getElementById('resultPanel');
  panel.classList.add('show');
  document.getElementById('submitBtn').disabled = true;
  panel.scrollIntoView({ behavior:'smooth', block:'center' });
}

function retryQuiz() {
  Object.keys(selections).forEach(k => delete selections[k]);
  QUESTIONS.forEach((_, idx) => {
    document.getElementById(`card-${idx}`).classList.remove('answered');
    [0,1,2,3].forEach(oi => {
      document.getElementById(`opt-${idx}-${oi}`)?.classList.remove('selected');
    });
  });
  updateProgress();
  document.getElementById('resultPanel').classList.remove('show');
  document.getElementById('submitBtn').disabled = false;
  window.scrollTo({ top:0, behavior:'smooth' });
}

buildQuestions();
updateProgress();
</script>
